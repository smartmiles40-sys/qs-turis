<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QS · by STFV</title>

    <!-- TELA PRETA NO DEPLOY (04/11): a Vercel guarda por 1 ANO tudo em /assets/
         (vercel.json, "immutable") — inclusive um 404. Se a aba pediu o JS novo
         no instante da troca de versão, o navegador guardou o 404 e o QS abria
         em branco até sair outro deploy. Aqui: se um script de /assets/ falhar,
         busca de novo com ?r=… (endereço diferente = fura o cache), uma vez.
         Fica no topo do <head> pra valer antes do script do app. -->
    <script>
      window.addEventListener("error", function (e) {
        var s = e.target;
        if (!s || s.tagName !== "SCRIPT" || !/\/assets\//.test(s.src || "") || s.getAttribute("data-qs-retry")) return;
        var n = document.createElement("script");
        n.type = "module";
        n.crossOrigin = "anonymous";
        n.setAttribute("data-qs-retry", "1");
        n.src = s.src.split("?")[0] + "?r=" + Date.now();
        document.head.appendChild(n);
      }, true);
    </script>

    <!-- Modo Noturno: aplica o tema salvo ANTES do React montar (sem piscar branco) -->
    <script>
      (function () {
        try {
          // Bolinha do QS (app do computador, ?bolinha=1): fundo transparente e sempre clara.
          if (/[?&]bolinha=1(&|$)/.test(location.search)) {
            document.documentElement.classList.add("qs-bolinha");
            document.documentElement.style.colorScheme = "light";
            return;
          }
          var t = localStorage.getItem("qs_theme");
          if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>

    <!-- PWA / Adicionar à tela de início -->
    <meta name="theme-color" content="#0147FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)" />
