    <title>QS · by STFV</title>

    <!-- TELA PRETA NO DEPLOY (04/11): a Vercel guarda por 1 ANO tudo em /assets/
         (vercel.json, "immutable") — inclusive um 404. Se a aba pediu o JS novo
         no instante da troca de versão, o navegador guardou o 404 e o QS abria
         em branco até sair outro deploy. Aqui: se um script/estilo de /assets/
         falhar, rebusca na rede o que falhou e recarrega uma vez.
         Fica no topo do <head> pra valer antes do script do app. -->
    <script>
      // 24/11 (Hugo: não abria; na anônima abria): o ?r= só refazia o arquivo
      // principal — os que ELE importa continuavam com o 404 guardado. Agora:
      // o arquivo que falhou e todo /assets/ que voltou erro são buscados com
      // cache "reload" (troca a entrada guardada pela resposta nova) e a página
      // recarrega UMA vez (marca de 30 s no sessionStorage, sem laço).
      (function () {
        var feito = false;
        function socorro(url) {
          if (feito) return; feito = true;
          try {
            var k = "qs_reload_404", t = Number(sessionStorage.getItem(k) || 0);
            if (t && Date.now() - t < 30000) return;
            sessionStorage.setItem(k, String(Date.now()));
          } catch (x) { return; }
          var urls = url ? [url] : [];
          try {
            performance.getEntriesByType("resource").forEach(function (r) {
              if (r.name.indexOf("/assets/") < 0) return;
              var st = r.responseStatus;
              if ((typeof st === "number" && st >= 400) || (st === undefined && r.transferSize === 0 && r.decodedBodySize === 0)) urls.push(r.name);
            });
          } catch (x) {}
          var volta = function () { location.reload(); };
          var pronto = Promise.all(urls.map(function (u) { return fetch(u, { cache: "reload" }).catch(function () {}); }));
          Promise.race([pronto, new Promise(function (r) { setTimeout(r, 4000); })]).then(volta, volta);
        }
        window.addEventListener("error", function (e) {
          var s = e.target, u = s && (s.src || s.href) || "";
          if (!s || (s.tagName !== "SCRIPT" && s.tagName !== "LINK") || u.indexOf("/assets/") < 0) return;
          socorro(u);
        }, true);
      })();
    </script>

    <!-- Modo Noturno: aplica o tema salvo ANTES do React montar (sem piscar branco) -->
    <script>
      (function () {
        try {
          // Bolinha do QS (app do computador, ?bolinha=1): fundo transparente e sempre clara.
          if (/[?&]bolinha=1(&|$)/.test(location.search)) {
            document.documentElement.classList.add("qs-bolinha");
            document.documentElement.style.colorScheme = "light";
            return;
          }
          var t = localStorage.getItem("qs_theme");
          if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
